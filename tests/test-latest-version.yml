name: Test setup-packer with latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert packer is on PATH
        run: |
          if ! command -v packer &>/dev/null; then
            echo "FAIL: packer not found on PATH"
            exit 1
          fi
          echo "PASS: packer found at $(command -v packer)"
      - name: Assert packer runs successfully
        run: |
          packer version
          if [ $? -ne 0 ]; then
            echo "FAIL: packer version command failed"
            exit 1
          fi
          echo "PASS: packer version ran successfully"
