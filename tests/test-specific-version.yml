name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.10.0"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          # Strip leading 'v' if present for comparison
          ACTUAL_STRIPPED="${ACTUAL#v}"
          if [ "$ACTUAL_STRIPPED" != "1.10.0" ]; then
            echo "FAIL: expected version '1.10.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version output matches expected '1.10.0'"
      - name: Assert packer is on PATH
        run: |
          if ! command -v packer >/dev/null 2>&1; then
            echo "FAIL: packer not found on PATH"
            exit 1
          fi
          echo "PASS: packer found at $(command -v packer)"
      - name: Assert packer version matches requested version
        run: |
          PACKER_VERSION=$(packer version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "packer reported version: $PACKER_VERSION"
          if [ "$PACKER_VERSION" != "1.10.0" ]; then
            echo "FAIL: expected packer version '1.10.0' but got '$PACKER_VERSION'"
            exit 1
          fi
          echo "PASS: packer version matches expected '1.10.0'"
